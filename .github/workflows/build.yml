name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Gera a estrutura padrão do projeto Flutter (pasta android, gradle etc.)
      - name: Criar projeto base
        run: flutter create --org com.example --project-name netscan_pro --platforms android build_app

      # Troca os arquivos gerados pelos do NetScan Pro
      - name: Copiar arquivos do app
        run: |
          cp main.dart build_app/lib/main.dart
          cp pubspec.yaml build_app/pubspec.yaml
          cp AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml
          mkdir -p build_app/android/app/src/main/kotlin/com/example/netscan_pro
          cp MainActivity.kt build_app/android/app/src/main/kotlin/com/example/netscan_pro/MainActivity.kt

      - name: Compilar APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: netscan-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
