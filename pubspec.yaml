name: netscan_pro
description: Scanner de rede local, monitor de sinal Wi-Fi e consulta de fabricante por MAC (Material 3).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Requisições HTTP (consulta OUI na API macvendors)
  http: ^1.2.2

  # IP, máscara e gateway do Wi-Fi atual
  network_info_plus: ^6.1.3

  # Permissão de localização (exigida pelo Android para ler dados do Wi-Fi)
  permission_handler: ^11.3.1

  # Ping ICMP real (usa o binário "ping" do sistema)
  dart_ping: ^9.0.1

  # Cores dinâmicas Material You (Android 12+)
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
